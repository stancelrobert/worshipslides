<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worship Slides</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8;
      --panel: #fff;
      --text: #1d252c;
      --muted: #66717d;
      --line: #d8dee5;
      --accent: #1f7a65;
      --accent-strong: #155f4d;
      --shadow: 0 16px 42px rgba(26, 38, 51, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, select, input { font: inherit; }

    button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { background: var(--accent-strong); }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    .shell {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 24px;
      min-height: 100vh;
      padding: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .controls {
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 20px;
      position: sticky;
      top: 24px;
    }

    .brand { display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; }
    .brand h1 { font-size: 1.35rem; line-height: 1.2; margin: 0; }
    .brand p { color: var(--muted); margin: 0; }

    .field { display: flex; flex-direction: column; gap: 8px; }

    .field label,
    .section-label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    select,
    input[type="number"] {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--text);
    }

    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .font-row {
      display: grid;
      grid-template-columns: 1fr 86px;
      gap: 10px;
      align-items: center;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .secondary { background: white; border-color: var(--line); color: var(--text); }
    .secondary:hover { background: #edf1f3; }

    .status {
      border-top: 1px solid var(--line);
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 16px;
    }

    .stage {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: calc(100vh - 48px);
      overflow: hidden;
    }

    .stage-header {
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
    }

    .stage-header h2 { font-size: 1.15rem; line-height: 1.25; margin: 0; }
    .stage-header p { color: var(--muted); margin: 4px 0 0; }

    .preview-wrap {
      display: grid;
      min-height: 0;
      padding: 20px;
      background: #eef2f4;
    }

    .preview {
      display: grid;
      place-items: center;
      min-height: 0;
      border-radius: 8px;
      background: #050505;
      color: white;
      overflow: hidden;
      padding: 32px;
      text-align: center;
    }

    .preview-text {
      width: 100%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-weight: 700;
      line-height: 1.18;
    }

    .hint { color: var(--muted); font-size: 0.9rem; line-height: 1.45; margin: 0; }

    .empty {
      color: var(--muted);
      display: grid;
      place-items: center;
      min-height: 260px;
      text-align: center;
    }

    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; padding: 14px; }
      .controls { position: static; }
      .stage { min-height: 62vh; }
      .stage-header { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="controls panel" aria-label="Presenter controls">
      <div class="brand">
        <h1>Worship Slides</h1>
        <p>Choose a song, set the size, and send lyrics to the projector window.</p>
      </div>

      <div class="field">
        <label for="songSelect">Song</label>
        <select id="songSelect"></select>
      </div>

      <div class="field">
        <label for="fontSize">Audience font size</label>
        <div class="font-row">
          <input id="fontSize" type="range" min="32" max="112" step="2" value="64">
          <input id="fontSizeNumber" type="number" min="32" max="112" step="2" value="64" aria-label="Font size in pixels">
        </div>
      </div>

      <button id="openDisplay">Open audience display</button>

      <div class="field">
        <div class="section-label">Navigation</div>
        <div class="button-row">
          <button id="prevSlide" class="secondary" type="button">Previous</button>
          <button id="nextSlide" type="button">Next</button>
        </div>
      </div>

      <p class="hint">Tip: after opening the audience display, drag it to the external screen and use the browser fullscreen command.</p>

      <div class="status">
        <span id="displayStatus">Display closed</span>
        <strong id="slideStatus">0 / 0</strong>
      </div>
    </section>

    <section class="stage panel" aria-label="Current slide preview">
      <header class="stage-header">
        <div>
          <h2 id="songTitle">No song selected</h2>
          <p id="songMeta"></p>
        </div>
        <p id="splitStatus">Waiting for lyrics</p>
      </header>
      <div class="preview-wrap">
        <div class="preview">
          <div id="previewText" class="preview-text empty">Select a song to start.</div>
        </div>
      </div>
    </section>
  </main>

    const state = {
      songIndex: 0,
      fontSize: 64,
      slideIndex: 0,
      slides: [],
      displayWindow: null
    };

    const els = {
      songSelect: document.getElementById("songSelect"),
      fontSize: document.getElementById("fontSize"),
      fontSizeNumber: document.getElementById("fontSizeNumber"),
      openDisplay: document.getElementById("openDisplay"),
      prevSlide: document.getElementById("prevSlide"),
      nextSlide: document.getElementById("nextSlide"),
      displayStatus: document.getElementById("displayStatus"),
      slideStatus: document.getElementById("slideStatus"),
      songTitle: document.getElementById("songTitle"),
      songMeta: document.getElementById("songMeta"),
      splitStatus: document.getElementById("splitStatus"),
      previewText: document.getElementById("previewText")
    };

    function projectionHtml() {
      return `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audience Display</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { color: #fff; font-family: Arial, Helvetica, sans-serif; }
    #slide {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 7vh 7vw;
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-weight: 700;
      line-height: 1.18;
    }
    #measure {
      position: fixed;
      left: -200vw;
      top: 0;
      width: 86vw;
      padding: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-weight: 700;
      line-height: 1.18;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div id="slide"></div>
  <div id="measure"></div>
</body>
</html>`;
    }

    function getDisplayDocument() {
      if (!state.displayWindow || state.displayWindow.closed) return null;
      return state.displayWindow.document;
    }

    function openDisplay() {
      if (!state.displayWindow || state.displayWindow.closed) {
        state.displayWindow = window.open("", "worshipSlidesDisplay", "popup=yes,width=1280,height=720");
        if (!state.displayWindow) {
          els.displayStatus.textContent = "Popup blocked";
          return;
        }
        state.displayWindow.document.open();
        state.displayWindow.document.write(projectionHtml());
        state.displayWindow.document.close();
        state.displayWindow.addEventListener("resize", debounce(rebuildSlides, 120));
      }
      state.displayWindow.focus();
      rebuildSlides();
    }

    function debounce(fn, wait) {
      let id;
      return () => {
        clearTimeout(id);
        id = setTimeout(fn, wait);
      };
    }

    function measureLines(lines, fontSize) {
      const displayDoc = getDisplayDocument();
      const fallbackLines = Math.max(1, Math.floor(520 / (fontSize * 1.18)));
      if (!displayDoc) {
        return { maxHeight: fallbackLines * fontSize * 1.18, measure: null };
      }

      const measure = displayDoc.getElementById("measure");
      measure.style.fontSize = `${fontSize}px`;
      const maxHeight = displayDoc.defaultView.innerHeight * 0.86;
      return { maxHeight, measure };
    }

    function splitLyrics(song, fontSize) {
      const lines = song.lyrics.filter(line => line.trim());
      const { maxHeight, measure } = measureLines(lines, fontSize);
      const slides = [];
      let current = [];

      for (const line of lines) {
        const candidate = current.concat(line);
        if (fits(candidate, measure, maxHeight, fontSize) || current.length === 0) {
          current = candidate;
        } else {
          slides.push(current.join("\n"));
          current = [line];
        }
      }

      if (current.length) slides.push(current.join("\n"));
      return slides.length ? slides : [""];
    }

    function fits(lines, measure, maxHeight, fontSize) {
      if (!measure) return lines.length * fontSize * 1.18 <= maxHeight;
      measure.textContent = lines.join("\n");
      return measure.scrollHeight <= maxHeight;
    }

    function rebuildSlides() {
      const song = songs[state.songIndex];
      state.slides = splitLyrics(song, state.fontSize);
      state.slideIndex = Math.min(state.slideIndex, state.slides.length - 1);
      render();
    }

    function render() {
      const song = songs[state.songIndex];
      const slide = state.slides[state.slideIndex] || "";
      els.songTitle.textContent = song.title;
      els.songMeta.textContent = song.author;
      els.previewText.textContent = slide || "No lyrics on this slide.";
      els.previewText.classList.toggle("empty", !slide);
      els.previewText.style.fontSize = `${Math.max(22, Math.round(state.fontSize * 0.55))}px`;
      els.slideStatus.textContent = `${state.slideIndex + 1} / ${state.slides.length}`;
      els.splitStatus.textContent = `${state.slides.length} slide${state.slides.length === 1 ? "" : "s"} at ${state.fontSize}px`;
      els.prevSlide.disabled = state.slideIndex === 0;
      els.nextSlide.disabled = state.slideIndex >= state.slides.length - 1;
      renderDisplay(slide);
    }

    function renderDisplay(slide) {
      const displayDoc = getDisplayDocument();
      els.displayStatus.textContent = displayDoc ? "Display open" : "Display closed";
      if (!displayDoc) return;
      const slideEl = displayDoc.getElementById("slide");
      slideEl.textContent = slide;
      slideEl.style.fontSize = `${state.fontSize}px`;
    }

    function setFontSize(value) {
      const size = Math.max(32, Math.min(112, Number(value) || 64));
      state.fontSize = size;
      els.fontSize.value = size;
      els.fontSizeNumber.value = size;
      rebuildSlides();
    }

    function go(delta) {
      state.slideIndex = Math.max(0, Math.min(state.slides.length - 1, state.slideIndex + delta));
      render();
    }

    function init() {
      songs.forEach((song, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = song.title;
        els.songSelect.append(option);
      });

      els.songSelect.addEventListener("change", () => {
        state.songIndex = Number(els.songSelect.value);
        state.slideIndex = 0;
        rebuildSlides();
      });
      els.fontSize.addEventListener("input", event => setFontSize(event.target.value));
      els.fontSizeNumber.addEventListener("change", event => setFontSize(event.target.value));
      els.openDisplay.addEventListener("click", openDisplay);
      els.prevSlide.addEventListener("click", () => go(-1));
      els.nextSlide.addEventListener("click", () => go(1));

      window.addEventListener("keydown", event => {
        if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") go(1);
        if (event.key === "ArrowLeft" || event.key === "PageUp") go(-1);
      });

      rebuildSlides();
      setInterval(() => renderDisplay(state.slides[state.slideIndex] || ""), 1000);
    }

    init();
  </script>
